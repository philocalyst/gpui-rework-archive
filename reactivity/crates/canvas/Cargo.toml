[package]
name = "gpui_canvas"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Local experimental observer, enabled only by the GPUI test dependency.
emission-trace = []
default = ["simd"]
parallel = ["dep:rayon"]
# Omit this feature to instantiate the same raster pipeline with Fallback.
simd = []

[dependencies]
triomphe = { version = "=0.1.17", default-features = false, features = ["std"] }
ecow = { version = "=0.3.1", default-features = false }
fearless_simd = { version = "=1.1.0", features = ["force_support_fallback"] }
fearless_simd_macros = "=0.1.0"
gpui_reactivity_core = { path = "../core" }
ttf-parser = "=0.25.1"
zeno = { version = "=0.3.3", default-features = false, features = ["eval", "std"] }
skrifa = "=0.49.0"
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
fontique = { version = "=0.12.0", default-features = false, features = ["std"] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
rayon = { version = "=1.12.0", optional = true }

[[example]]
name = "parallel"
required-features = ["parallel"]

[dev-dependencies]
# Independent exact mask oracle in tests/render.rs.
swash = "=0.2.10"
rustybuzz = "=0.20.1"
fontdue = "=0.9.5"
allocation-counter = "=0.8.1"
