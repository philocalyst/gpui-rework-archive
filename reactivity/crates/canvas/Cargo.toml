[package]
name = "gpui_canvas"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
gpui_reactivity_core = { path = "../core" }
rustybuzz = "=0.20.1"
swash = "=0.2.10"
skrifa = "=0.44.0"
unicode-script = "=0.5.8"
rayon = { version = "=1.12.0", optional = true }

[[example]]
name = "parallel"
required-features = ["parallel"]

[dev-dependencies]
fontdue = "=0.9.4"
allocation-counter = "=0.8.1"
