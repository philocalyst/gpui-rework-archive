[package]
name = "gpui_canvas"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["simd"]
parallel = ["dep:rayon"]
# Omit this feature to instantiate the same raster pipeline with Fallback.
simd = []

[dependencies]
fearless_simd = { version = "=1.1.0", features = ["force_support_fallback"] }
fearless_simd_macros = "=0.1.0"
gpui_reactivity_core = { path = "../core" }
ttf-parser = "=0.25.1"
swash = "=0.2.10"
skrifa = "=0.44.0"
parley = { version = "=0.11.1", default-features = false, features = ["std", "complex-scripts"] }
fontique = { version = "=0.11.1", default-features = false, features = ["std"] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
rayon = { version = "=1.12.0", optional = true }

[[example]]
name = "parallel"
required-features = ["parallel"]

[dev-dependencies]
rustybuzz = "=0.20.1"
fontdue = "=0.9.4"
allocation-counter = "=0.8.1"
