[package]
name = "gpui_reactivity_host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Event-loop boundary for the GPUI clean-room experiments"

[features]
default = []
x11 = ["dep:winit", "winit/x11"]
wayland = ["dep:winit", "winit/wayland", "winit/wayland-dlopen"]
native = ["dep:winit"]

[dependencies]
winit = { path = "../../vendor/winit", default-features = false, features = ["rwh_06"], optional = true }
