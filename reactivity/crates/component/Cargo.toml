[package]
name = "gpui-component"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Application-owned styled controls for the clean-room GPUI runtime"

[dependencies]
gpui = { path = "../gpui", default-features = false }

[dev-dependencies]
allocation-counter = "=0.8.1"

[features]
default = []
native = ["gpui/native"]
x11 = ["native", "gpui/x11"]
wayland = ["native", "gpui/wayland"]
