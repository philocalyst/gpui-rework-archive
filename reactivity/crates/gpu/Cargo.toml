[package]
name = "gpui_gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPU rendering of GPUI's canonical prepared scene"
publish = false

[features]
default = ["simd"]
simd = ["gpui_canvas/simd"]
# Hardware oracle on the native backend; software Vulkan remains explicit.
gpu-tests = []
vulkan-tests = ["gpu-tests"]
offline-shader = ["dep:naga", "dep:sha2", "wgpu/shader-artifacts"]

[[test]]
name = "render"
required-features = ["gpu-tests"]

[[example]]
name = "tiles"
required-features = ["gpu-tests"]

[dependencies]
gpui_canvas = { path = "../canvas", default-features = false }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "metal", "dx12"] }
wgsl-rs = { version = "=0.1.0-beta.6", default-features = false, features = ["validation"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }

[build-dependencies]
naga = { version = "=30.0.1", optional = true, features = ["wgsl-in", "spv-out", "spv-in"] }
sha2 = { version = "=0.11.1", optional = true, default-features = false }
wgsl-rs = { version = "=0.1.0-beta.6", default-features = false, features = ["validation"] }

[dev-dependencies]
pollster = "=1.0.1"

[[example]]
name = "groups"
required-features = ["gpu-tests"]

[[example]]
name = "images"
required-features = ["gpu-tests"]
