[package]
name = "gpui_gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPU rendering of GPUI's canonical prepared scene"
publish = false

[features]
vulkan-tests = []

[[test]]
name = "render"
required-features = ["vulkan-tests"]

[[example]]
name = "tiles"
required-features = ["vulkan-tests"]

[dependencies]
gpui_canvas = { path = "../canvas" }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "metal", "dx12"] }
wgsl-rs = { version = "=0.1.0-beta.1", default-features = false, features = ["validation"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }

[dev-dependencies]
pollster = "=0.4.0"

