[package]
name = "gpui_reactivity_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
arcstr = { version = "=1.2.0", default-features = false, features = ["std"], optional = true }
cephal = { path = "../../vendor/cephal", optional = true }

[features]
# Sealed full-root immutable UTF-8 backing adapter; no semantic source interner.
shared-utf8 = ["dep:arcstr"]
default = []
layout = ["dep:cephal"]

[[example]]
name = "retained_layout"
required-features = ["layout"]
