[package]
name = "gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Clean-room GPUI implementation: typed views and coherent retained presentation"
publish = false

[dependencies]
arcstr = { version = "=1.2.0", default-features = false, features = ["std"] }
gpui_reactivity_core = { path = "../core", features = ["layout"] }
gpui_reactivity_state = { path = "../state", features = ["serde"] }
gpui_canvas = { path = "../canvas", default-features = false }
cephal = { path = "../../vendor/cephal", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui_gpu = { path = "../gpu", default-features = false, optional = true }
gpui_reactivity_host = { path = "../host", optional = true }
pollster = { version = "=0.4.0", optional = true }
softbuffer = { version = "=0.4.8", default-features = false, optional = true }
accesskit = { version = "=0.25.1", optional = true }
accesskit_winit = { version = "=0.34.1", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"], optional = true }

[features]
default = ["simd"]
simd = ["gpui_canvas/simd", "gpui_gpu?/simd"]
accessibility = ["native", "dep:accesskit", "dep:accesskit_winit"]
native = ["dep:gpui_gpu", "dep:gpui_reactivity_host", "gpui_reactivity_host/native", "dep:pollster", "dep:softbuffer"]
desktop = ["native", "accessibility"]
x11 = ["x11-minimal", "accessibility"]
wayland = ["wayland-minimal", "accessibility"]
# Explicit AT-disabled transport diagnostics; ordinary shipped Linux profiles
# above include the real AT-SPI adapter, not AccessKit's null Unix backend.
x11-minimal = ["native", "gpui_reactivity_host/x11", "softbuffer/x11", "softbuffer/x11-dlopen"]
wayland-minimal = ["native", "gpui_reactivity_host/wayland", "softbuffer/wayland", "softbuffer/wayland-dlopen"]

[dev-dependencies]
triomphe = { version = "=0.1.16", default-features = false, features = ["std"] }
allocation-counter = "=0.8.1"
accesskit_consumer = "=0.39.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "=6.0.0", default-features = false, features = ["default-rt", "proxy", "service"] }
zruntime = { version = "=0.2.0", default-features = false, features = ["runtime", "mpmc"] }
x11rb = { version = "=0.13.2", features = ["record", "shm", "request-parsing"] }

[[example]]
name = "workbench"
required-features = ["native"]

[[example]]
name = "empty"
required-features = ["native"]

[[example]]
name = "graphics"
required-features = ["native"]

