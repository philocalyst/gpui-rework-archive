[package]
name = "gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Clean-room GPUI implementation: typed views and coherent retained presentation"
publish = false

[dependencies]
gpui_reactivity_core = { path = "../core", features = ["layout"] }
gpui_reactivity_state = { path = "../state", features = ["serde"] }
gpui_canvas = { path = "../canvas" }
cephal = { path = "../../vendor/cephal", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui_gpu = { path = "../gpu", optional = true }
gpui_reactivity_host = { path = "../host", optional = true }
pollster = { version = "=0.4.0", optional = true }
softbuffer = { version = "=0.4.8", default-features = false, optional = true }

[features]
default = []
native = ["dep:gpui_gpu", "dep:gpui_reactivity_host", "gpui_reactivity_host/native", "dep:pollster", "dep:softbuffer"]
x11 = ["native", "gpui_reactivity_host/x11", "softbuffer/x11", "softbuffer/x11-dlopen"]
wayland = ["native", "gpui_reactivity_host/wayland", "softbuffer/wayland", "softbuffer/wayland-dlopen"]

[[example]]
name = "workbench"
required-features = ["native"]

[[example]]
name = "empty"
required-features = ["native"]

[[example]]
name = "graphics"
required-features = ["native"]
