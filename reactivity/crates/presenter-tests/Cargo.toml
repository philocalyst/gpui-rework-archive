[package]
name = "gpui_presenter_tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

# Only the test binaries depend on these platform packages. Tests use the root
# lock and explicitly selected features, independent of archived vendor dev locks.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu-hal = { path = "../../vendor/wgpu-hal", features = ["metal"] }
softbuffer = { path = "../../vendor/softbuffer", default-features = false }
raw-window-handle = "=0.6.2"
objc2 = "=0.6.5"
static_assertions = "=1.1.0"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSObject"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFDate"] }

[[test]]
name = "apple_metal_layers"
path = "../../vendor/wgpu-hal/tests/apple_layers.rs"
harness = false

[[test]]
name = "apple_software_layers"
path = "../../vendor/softbuffer/tests/apple_layers.rs"
harness = false
