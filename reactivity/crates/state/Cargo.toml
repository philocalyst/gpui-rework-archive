[package]
name = "gpui_reactivity_state"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Explicit state and publication protocol primitives for the reactivity spike"

[lib]
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
