[package]
name = "inventory-rust"
version = "0.1.0"
edition = "2024"
publish = false

# An offline analysis tool, never a dependency of the UI workspace.
[workspace]

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.45"
serde_json = "=1.0.151"
syn = { version = "=2.0.119", features = ["full", "visit"] }
