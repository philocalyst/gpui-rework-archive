[package]
name = "hummingbird-gpui-port"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[features]
default = []
native = ["gpui/x11"]

[dependencies]
gpui = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/crates/gpui" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
nucleo-matcher = "=0.3.1"
triomphe = { version = "=0.1.17", default-features = false, features = ["std"] }
fastrand = "=2.5.0"

[dev-dependencies]
allocation-counter = "=0.8.1"

[patch.crates-io]
parley = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/parley" }
parley_engine = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/parley_engine" }
winit = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/winit" }
wgpu = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/wgpu" }
wgpu-hal = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/wgpu-hal" }
wgpu-core = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/wgpu-core" }
softbuffer = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/softbuffer" }
accesskit_unix = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/accesskit_unix" }
accesskit_atspi_common = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/accesskit_atspi_common" }
accesskit = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/accesskit" }
accesskit_consumer = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/accesskit_consumer" }
accesskit_macos = { path = "/tmp/gpui-rapid-pointer-sol/reactivity/vendor/accesskit_macos" }
