[package]
name = "ack-query-control"
version = "0.0.0"
edition = "2024"

[dependencies]
allocation-counter = "=0.8.1"
gpui = { path = "/root/gpui-monotonic-caret-baseline/reactivity/crates/gpui", features = ["x11"] }

[profile.release]
debug = 1

[patch.crates-io]
wgpu-core = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/wgpu-core" }
wgpu = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/wgpu" }
parley = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/parley" }
parley_engine = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/parley_engine" }
winit = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/winit" }
wgpu-hal = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/wgpu-hal" }
softbuffer = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/softbuffer" }
accesskit_unix = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/accesskit_unix" }
accesskit_atspi_common = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/accesskit_atspi_common" }
accesskit = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/accesskit" }
accesskit_consumer = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/accesskit_consumer" }
accesskit_macos = { path = "/root/gpui-monotonic-caret-baseline/reactivity/vendor/accesskit_macos" }
