[package]
name = "gamut_consumer"
version = "0.1.0"
edition = "2024"
[features]
default = ["simd"]
simd = ["gpui_canvas/simd"]
primitive = []
[dependencies]
gpui_canvas = { path = "/root/gpui-designer-gamut/reactivity/crates/canvas", default-features = false }
allocation-counter = "=0.8.1"
[profile.release]
opt-level = 3
[patch.crates-io]
parley = { path = "/root/gpui-designer-gamut/reactivity/vendor/parley" }
parley_engine = { path = "/root/gpui-designer-gamut/reactivity/vendor/parley_engine" }
