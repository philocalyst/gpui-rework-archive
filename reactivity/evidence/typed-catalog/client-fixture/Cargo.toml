[package]
name = "catalog-client-fixture"
version = "0.0.0"
edition = "2024"

[workspace]
members = ["libraries/*"]
resolver = "3"

[dependencies]
gpui = { path = "../../../crates/gpui" }
action-button = { path = "libraries/action-button" }
filter-chip = { path = "libraries/filter-chip" }

[patch.crates-io]
wgpu = { path = "../../../vendor/wgpu" }
wgpu-hal = { path = "../../../vendor/wgpu-hal" }
wgpu-core = { path = "../../../vendor/wgpu-core" }
parley = { path = "../../../vendor/parley" }
parley_engine = { path = "../../../vendor/parley_engine" }
winit = { path = "../../../vendor/winit" }
softbuffer = { path = "../../../vendor/softbuffer" }
accesskit = { path = "../../../vendor/accesskit" }
accesskit_consumer = { path = "../../../vendor/accesskit_consumer" }
accesskit_macos = { path = "../../../vendor/accesskit_macos" }
accesskit_unix = { path = "../../../vendor/accesskit_unix" }
accesskit_atspi_common = { path = "../../../vendor/accesskit_atspi_common" }

[profile.release]
debug = 1

