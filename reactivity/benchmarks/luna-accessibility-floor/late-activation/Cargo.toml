[package]
name = "late-activation-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
accesskit = "=0.25.1"
accesskit_unix = { version = "=0.24.0", default-features = false, features = ["async-io"] }
futures-util = "=0.3.34"
tokio = { version = "=1.54.0", features = ["macros", "rt", "time"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api", "tokio"] }
