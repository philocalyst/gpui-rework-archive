[package]
name = "a11y-floor-probe-tokio"
version = "0.1.0"
edition = "2021"

[dependencies]
accesskit = { version = "=0.25.1" }
accesskit_unix = { version = "=0.24.0", default-features = false, features = ["tokio"] }
# Feature-unify zbus to enable its Tokio backend; accesskit_unix 0.24 doesn't forward this feature.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "tokio"] }

[dependencies.tokio]
version = "=1.54.0"
features = ["rt", "net", "time"]
