[package]
name = "a11y-floor-probe-async"
version = "0.1.0"
edition = "2021"

[dependencies]
accesskit = { version = "=0.25.1" }
accesskit_unix = { version = "=0.24.0", default-features = false, features = ["async-io"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "tokio"] }
tokio = { version = "=1.54.0", features = ["rt", "net", "time"] }
