[package]
name = "hummingbird-gpui-port"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[features]
default = []
native = ["gpui/x11", "cpal-output"]
audio = ["dep:symphonia", "dep:rtrb", "dep:rubato", "dep:audioadapter-buffers"]
cpal-output = ["audio", "dep:cpal"]

[dependencies]
gpui = { path = "../../crates/gpui" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
nucleo-matcher = "=0.3.1"
triomphe = { version = "=0.1.17", default-features = false, features = ["std"] }
fastrand = "=2.5.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3"], optional = true }
rtrb = { version = "=0.4.0", optional = true }
rubato = { version = "=5.0.1", optional = true }
audioadapter-buffers = { version = "=5.2.0", optional = true }
cpal = { version = "=0.18.2", default-features = false, optional = true }

[dev-dependencies]
allocation-counter = "=0.8.1"

[patch.crates-io]
parley = { path = "../../vendor/parley" }
parley_engine = { path = "../../vendor/parley_engine" }
winit = { path = "../../vendor/winit" }
wgpu = { path = "../../vendor/wgpu" }
wgpu-hal = { path = "../../vendor/wgpu-hal" }
wgpu-core = { path = "../../vendor/wgpu-core" }
softbuffer = { path = "../../vendor/softbuffer" }
accesskit_unix = { path = "../../vendor/accesskit_unix" }
accesskit_atspi_common = { path = "../../vendor/accesskit_atspi_common" }
accesskit = { path = "../../vendor/accesskit" }
accesskit_consumer = { path = "../../vendor/accesskit_consumer" }
accesskit_macos = { path = "../../vendor/accesskit_macos" }

[[example]]
name = "audio_output"
required-features = ["cpal-output"]
