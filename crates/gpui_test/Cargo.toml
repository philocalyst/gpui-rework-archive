[package]
name = "gpui_ce_test"
version = "0.1.0"
description = "Deterministic visual scenario testing for GPUI"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
gpu = ["dep:gpui_ce_wgpu"]
platform = ["dep:gpui_ce_platform"]

[lib]
name = "gpui_test"
path = "src/lib.rs"

[[bin]]
name = "gpui-test"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui = { path = "../gpui", version = "0.2.2", package = "gpui-ce", default-features = false, features = ["test-support"] }
gpui_ce_parley = { path = "../gpui_ce_parley", version = "0.1.0", default-features = false }
gpui_ce_render = { path = "../gpui_render", version = "0.1.0", features = ["cpu"] }
gpui_ce_wgpu = { path = "../gpui_wgpu", version = "0.1.0", package = "gpui_ce_wgpu", optional = true, features = ["test-support"] }
gpui_ce_platform = { path = "../gpui_platform", version = "0.1.0", package = "gpui_ce_platform", optional = true, features = ["test-support", "x11", "wayland"] }
image.workspace = true
plotters = { version = "0.3.7", default-features = false, features = ["line_series", "svg_backend"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"

[dev-dependencies]
insta = { version = "1.43.1", features = ["json"] }
proptest.workspace = true
