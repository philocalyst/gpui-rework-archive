[package]
name = "gpui_codepen_guest"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
interpreter = ["gpui/headless", "dep:image"]
host-services = ["dep:gpui_ce_parley"]

[dependencies]
gpui = { package = "gpui-ce", path = "../../gpui", default-features = false }
gpui_ce_parley = { path = "../../gpui_ce_parley", default-features = false, optional = true }
image = { version = "0.25", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
anyhow = "1"

[lints]
workspace = true
