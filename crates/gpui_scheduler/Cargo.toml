[package]
name = "gpui_ce_scheduler"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "Async task scheduler/executor for gpui-ce (vendored from Zed)."
[lib]
name = "scheduler"
path = "src/scheduler.rs"
doctest = false
[features]
test-support = []
wasm-threads = ["dep:wasm_thread", "flume/spin"]
[dependencies]
async-task.workspace = true
backtrace.workspace = true
chrono = { workspace = true, features = ["now", "wasmbind"] }
flume.workspace = true
futures.workspace = true
parking_lot.workspace = true
rand.workspace = true
web-time.workspace = true
[target.'cfg(target_family = "wasm")'.dependencies]
wasm_thread = { version = "0.3.3", features = ["es_modules"], optional = true }
