[package]
name = "gpui_ce_zed_util"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "OS/utility helpers used by gpui-ce platform backends (vendored from Zed's util)."
repository = "https://github.com/gpui-ce/gpui-ce"
[lib]
name = "util"
path = "src/util.rs"
doctest = true
[features]
test-support = ["rand", "path/test-support"]
debug-embed = ["rust-embed/debug-embed"]
[dependencies]
anyhow.workspace = true
collections.workspace = true
dunce.workspace = true
globset = "0.4"
itertools.workspace = true
rand = { workspace = true, optional = true }
regex = { workspace = true, features = ["unicode-bool", "unicode-gencat"] }
rust-embed = { version = "8.11", features = ["include-exclude"] }
schemars = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
take-until = "0.2.0"
unicase = "2.6"
url.workspace = true
percent-encoding = "2.3.2"
gpui_util.workspace = true
path = { workspace = true, features = ["serde"] }
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tempfile.workspace = true
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
futures-lite = "2.6.1"
futures.workspace = true
shlex = "1.3.0"
smol.workspace = true
async-fs = "2.1"
walkdir = "2.5"
dirs = "6.0"
[target.'cfg(any(unix, not(target_family = "wasm")))'.dependencies]
log.workspace = true
[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc.workspace = true
nix = { version = "0.29", features = ["resource", "user"] }
[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true
which = "6.0.0"
[target.'cfg(windows)'.dependencies]
which = "6.0.0"
windows = { workspace = true, features = ["Win32_System_JobObjects"] }
[dev-dependencies]
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
rand.workspace = true
path = { workspace = true, features = ["test-support"] }
[target.'cfg(unix)'.dev-dependencies]
which = "6.0.0"
