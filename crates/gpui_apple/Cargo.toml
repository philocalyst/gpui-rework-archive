[package]
name = "gpui_ce_apple"
version = "0.1.0"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "gpui_apple"
path = "src/gpui_apple.rs"
doctest = false

[features]
default = []
# Kept for feature compatibility; gpui_render now supplies the native shader artifacts.
runtime_shaders = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
# Retained for compatibility; the Parley text system is built on Apple targets.
font-kit = []

[dependencies]
gpui.workspace = true
gpui_render.workspace = true
wgsl-rs.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
anyhow.workspace = true
async-task.workspace = true
block2.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text.workspace = true
derive_more.workspace = true
dispatch2.workspace = true
etagere.workspace = true
foreign-types.workspace = true
futures.workspace = true
gpui_parley = { workspace = true, features = ["system-fonts"] }
gpui_util.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
mach2.workspace = true
metal.workspace = true
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFBase"] }
objc2-core-video = { workspace = true, features = ["CVPixelBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVReturn", "objc2", "objc2-metal"] }
objc2-metal = { version = "0.3", default-features = false, features = ["MTLDevice", "MTLPixelFormat", "MTLTexture"] }
objc2-foundation = { workspace = true, features = ["NSThread", "NSNotification", "NSOperation", "NSProcessInfo", "block2"] }
objc2-quartz-core.workspace = true
objc2-security.workspace = true
parking_lot.workspace = true
pathfinder_geometry.workspace = true
smallvec.workspace = true
skrifa.workspace = true
thiserror.workspace = true
font-kit = { version = "0.14.1-zed", package = "zed-font-kit", features = ["source"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
objc2-core-video = { workspace = true, features = ["CVBase"] }
gpui_fonts = { path = "../gpui_ce_fonts", version = "0.2.2", package = "gpui-ce-fonts" }
