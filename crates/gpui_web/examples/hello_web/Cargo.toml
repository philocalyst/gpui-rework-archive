[workspace]

[package]
name = "hello_web"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hello_web"
path = "main.rs"

[[bin]]
name = "gallery_bootstrap"
path = "gallery_bootstrap.rs"

[[bin]]
name = "hello_world"
path = "../../../gpui/examples/hello_world.rs"

[[bin]]
name = "text"
path = "../../../gpui/examples/text.rs"

[[bin]]
name = "input"
path = "../../../gpui/examples/text_input.rs"

[[bin]]
name = "http_client_test"
path = "http_client_test.rs"

[[bin]]
name = "queue_test"
path = "queue_test.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
gpui = { path = "../../../gpui", package = "gpui-ce" }
gpui_platform = { path = "../../../gpui_platform", package = "gpui_ce_platform" }
gpui_util = { path = "../../../gpui_ce_util", package = "gpui_ce_util" }
gpui_elements = { path = "../../../gpui_elements", package = "gpui_ce_elements" }
gpui_web = { path = "../..", package = "gpui_ce_web" }
unicode-segmentation = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm_thread = { version = "0.3.3", features = ["es_modules"] }
web-sys = { version = "0.3", features = ["console", "Location", "Window"] }
web-time = "1"
gpui_fonts = { path = "../../../gpui_ce_fonts", package = "gpui-ce-fonts" }
