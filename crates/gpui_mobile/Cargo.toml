[package]
name = "gpui_ce_mobile"
version = "0.3.0"
description = "Android platform backend for GPUI CE"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "gpui_mobile"

[features]
default = []
offscreen = ["gpui_wgpu/test-support", "dep:image"]

[dependencies]
gpui.workspace = true
accesskit.workspace = true
gpui_wgpu.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
image = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
gpui_parley = { workspace = true, features = ["system-fonts"] }
libc.workspace = true
memmap2 = "0.9"
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
accesskit_android = "0.7.5"
rustc-hash = "2"
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
