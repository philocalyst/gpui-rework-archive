# Include this file from .gitlab-ci.yml with:
#   include:
#     - local: docs/ci/gitlab-visual-tests.yml
# The CPU contracts need no display or GPU. The primary report attempts a Mesa
# software Vulkan replay and falls back to the same CPU report if it fails.
gpui-visual-tests:
  stage: test
  image: rust:latest
  variables:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    WGPU_BACKEND: vulkan
    VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3
    - >-
      apt-get install -y --no-install-recommends
      libxkbcommon-dev libwayland-dev libx11-dev
      libxcb-shape0-dev libxcb-xfixes0-dev
      libxcb-randr0-dev libxcb-xinput-dev
      libxkbcommon-x11-dev libegl1-mesa-dev
      libgles2-mesa-dev libglib2.0-dev libfontconfig-dev libvulkan-dev
      mesa-vulkan-drivers vulkan-tools
  script:
    - python3 -m unittest discover -s scripts/testing -p 'test_*.py'
    - cargo test --locked --package gpui_ce_render --features cpu
    - cargo test --locked -p gpui_ce_parley --lib
    - cargo test --locked --package gpui_ce_test --lib --bin gpui-test --test state_regressions --test report_collection
    - cargo test --locked -p gpui-ce --features test-support --lib elements::img::tests
    - cargo test --locked -p gpui-ce --features test-support --lib scene::tests
    - |
      if ! cargo test --locked --package gpui_ce_test --test gallery_snapshots; then
        echo "WARNING: reviewed scene or pixel snapshots changed; inspect captures before updating baselines."
      fi
    - |
      set -eu
      base_sha="${GPUI_VISUAL_BASE_SHA:-${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}}"
      if [ -z "$base_sha" ] && [ "${CI_PIPELINE_SOURCE:-}" = "push" ]; then
        base_sha="${CI_COMMIT_BEFORE_SHA:-}"
      fi
      if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
        base_sha=""
      fi

      if [ -z "$base_sha" ]; then
        echo "WARNING: no base commit was provided; visual comparisons will be skipped."
      elif ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
        echo "WARNING: base commit $base_sha is unavailable in this checkout; visual comparisons will be skipped."
      else
        baseline_checkout="$(mktemp -d)"
        rmdir "$baseline_checkout"
        trap 'git worktree remove --force "$baseline_checkout" >/dev/null 2>&1 || true' EXIT
        if ! git worktree add --detach "$baseline_checkout" "$base_sha"; then
          echo "WARNING: could not create the base worktree; visual comparisons will be skipped."
        elif [ ! -x "$baseline_checkout/scripts/gpui-test" ]; then
          echo "WARNING: base revision predates the visual-test harness; comparisons will be skipped."
        else
          inputs="$CI_PROJECT_DIR/visual-baseline-inputs"
          rm -rf "$inputs" "$CI_PROJECT_DIR/visual-baseline"
          mkdir -p "$inputs"
          if ! GIT_SHA="$base_sha" "$baseline_checkout/scripts/gpui-test" bench --output "$inputs/core"; then
            echo "WARNING: base capture failed; current captures will still be generated."
          elif [ -f "$baseline_checkout/scripts/testing/capture_examples.py" ]; then
            if GIT_SHA="$base_sha" python3 "$baseline_checkout/scripts/testing/capture_examples.py" --samples 20 --output "$inputs/examples"; then
              set -- "$inputs/core" "$inputs"/examples/*
              if ! GIT_SHA="$base_sha" "$baseline_checkout/scripts/gpui-test" collect "$@" --output "$CI_PROJECT_DIR/visual-baseline"; then
                echo "WARNING: base collector could not combine example reports; using its built-in suite as the baseline."
                rm -rf "$CI_PROJECT_DIR/visual-baseline"
                cp -a "$inputs/core" "$CI_PROJECT_DIR/visual-baseline"
              fi
            else
              echo "WARNING: base example captures failed; using the built-in suite baseline. New examples will have no baseline."
              cp -a "$inputs/core" "$CI_PROJECT_DIR/visual-baseline"
            fi
          else
            echo "WARNING: base revision has no example capture batch; new examples will have no baseline."
            cp -a "$inputs/core" "$CI_PROJECT_DIR/visual-baseline"
          fi
        fi
      fi
    - |
      set -eu
      rm -rf visual-captures visual-report
      set -- collect --output visual-report
      scripts/gpui-test bench --output visual-captures/core
      python3 scripts/testing/capture_examples.py --samples 20 --output visual-captures/examples
      if [ -f visual-baseline/manifest.json ]; then
        set -- "$@" --baseline visual-baseline
      else
        echo "WARNING: no combined baseline capture is available; generating current captures without diffs."
      fi
      set -- "$@" visual-captures/core visual-captures/examples/*
      if ! GIT_SHA="$CI_COMMIT_SHA" scripts/gpui-test "$@" --gpu; then
        echo "WARNING: software-native replay was unavailable or failed; regenerating the primary report with CPU captures only."
        rm -rf visual-report
        GIT_SHA="$CI_COMMIT_SHA" scripts/gpui-test "$@"
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - visual-report/
      - visual-baseline/
      - crates/gpui_test/tests/snapshots/*.snap.new
    # Merge-request source controls its generated HTML/SVG. Keep those out of
    # GitLab's authenticated artifact browser; PNG/JSON remain downloadable.
    exclude:
      - visual-report/*.html
      - visual-report/*.svg
      - visual-report/**/*.html
      - visual-report/**/*.svg
      - visual-baseline/*.html
      - visual-baseline/*.svg
      - visual-baseline/**/*.html
      - visual-baseline/**/*.svg
    expose_as: "GPUI visual report"

gpui-miri-capture-validation:
  stage: test
  image: rust:latest
  variables:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    MIRI_TOOLCHAIN: nightly-2026-09-30
  before_script:
    - rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri
  script:
    - cargo "+$MIRI_TOOLCHAIN" miri setup
    - cargo "+$MIRI_TOOLCHAIN" miri test --locked -p gpui_ce_render --features cpu --test capture_validation

gpui-native-lavapipe:
  stage: test
  image: rust:latest
  variables:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    GPUI_REQUIRE_GPU: "1"
    WGPU_BACKEND: vulkan
    VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      libxkbcommon-dev libwayland-dev libx11-dev
      libxcb-shape0-dev libxcb-xfixes0-dev
      libxcb-randr0-dev libxcb-xinput-dev
      libxkbcommon-x11-dev libegl1-mesa-dev
      libgles2-mesa-dev libglib2.0-dev libfontconfig-dev libvulkan-dev
      mesa-vulkan-drivers vulkan-tools
    - test -f "$VK_ICD_FILENAMES"
    - vulkaninfo --summary
  script:
    - cargo test --release --locked --package gpui_ce_wgpu --features test-support --lib --test capture_parity
    - cargo test --release --locked --package gpui_ce_test --features gpu --test native_replay
gpui-native-platform-linux:
  stage: test
  image: rust:latest
  variables:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    WGPU_BACKEND: vulkan
    VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      libxkbcommon-dev libwayland-dev libx11-dev
      libxcb-shape0-dev libxcb-xfixes0-dev
      libxcb-randr0-dev libxcb-xinput-dev
      libxkbcommon-x11-dev libegl1-mesa-dev
      libgles2-mesa-dev libglib2.0-dev libfontconfig-dev libvulkan-dev
      xvfb openbox mesa-vulkan-drivers
    - test -f "$VK_ICD_FILENAMES"
  script:
    - xvfb-run -a -s '-screen 0 1280x800x24' bash -c 'openbox >/dev/null 2>&1 & scripts/gpui-test platform --output native-platform-report'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - native-platform-report/

# Optional GitLab Pages setup: copy visual-report/ to public/ from a trusted
# branch pipeline. Do not publish merge-request-generated HTML or SVG.
