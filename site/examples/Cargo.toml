[package]
name = "gpui-documentation-examples"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "gpui-documentation-examples"


[dependencies]
gpui = { package = "gpui-ce", path = "../../crates/gpui", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { package = "gpui_ce_platform", path = "../../crates/gpui_platform", features = ["wayland", "x11"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { package = "gpui_ce_web", path = "../../crates/gpui_web", default-features = false }
gpui_ce_codepen = { path = "../../crates/gpui_codepen" }
gpui_ce_elements = { path = "../../crates/gpui_elements" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
js-sys.workspace = true
web-sys = { version = "0.3", features = ["Window", "Location", "MessageEvent", "EventTarget", "console"] }

[target.'cfg(target_os = "macos")'.dependencies]
io-surface = { version = "0.16.1", features = ["link"] }
